[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadman"
version = "0.1.0"
description = "Know the moment a scheduled job fails or silently stops running."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
deadman = "deadman.cli:main"

[tool.setuptools]
packages = ["deadman"]
